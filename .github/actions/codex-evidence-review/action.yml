name: Codex evidence review
description: Advisory Codex CLI review of verified sample test metadata using a ChatGPT login
inputs:
  codex-auth-json:
    description: GitHub secret containing Codex CLI ChatGPT auth.json; never an inline credential
    default: ''
  evidence-bundle:
    description: Extracted evidence artifact directory
    required: true
  head-sha:
    description: Expected PR head SHA
    required: true
  pull-request:
    description: Expected PR number
    required: true
  review-output:
    description: Output advisory Markdown
    default: codex-review/review.md
outputs:
  status:
    description: completed, not_configured or failed
    value: ${{ steps.report.outputs.status }}
  report-json:
    description: Structured Codex CI report path, including non-completed outcomes
    value: ${{ steps.report.outputs.report-json }}
  report-markdown:
    description: Human-readable Codex CI report path
    value: ${{ steps.report.outputs.report-markdown }}
  report-html:
    description: Standalone browser-readable report path
    value: ${{ steps.report.outputs.report-html }}
runs:
  using: composite
  steps:
    - name: Install pinned Codex CLI
      if: inputs.codex-auth-json != ''
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/exhibit-codex-cli" --no-audit --no-fund @openai/codex@0.164.0
        # RUNNER_TEMP may be inaccessible to the separate review UID. Publish
        # only the verified runtime under a root-owned, executable location.
        sudo cp -a "$RUNNER_TEMP/exhibit-codex-cli" /opt/exhibit-codex-cli
        sudo chown -R root:root /opt/exhibit-codex-cli
        sudo chmod -R a+rX /opt/exhibit-codex-cli
    - name: Prepare disposable Linux sandbox
      if: inputs.codex-auth-json != ''
      shell: bash
      env:
        REVIEW_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        test "$REVIEW_RUNNER_ENVIRONMENT" = github-hosted
        if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
          sudo sysctl -w kernel.unprivileged_userns_clone=1
        fi
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Create unprivileged review account
      if: inputs.codex-auth-json != ''
      shell: bash
      run: sudo useradd --system --user-group --create-home --shell /usr/sbin/nologin exhibit-review
    - name: Verify CLI access as review account
      if: inputs.codex-auth-json != ''
      shell: bash
      run: sudo -u exhibit-review env -i HOME=/home/exhibit-review PATH="$PATH" /opt/exhibit-codex-cli/node_modules/.bin/codex --version
    - id: review
      shell: bash
      env:
        EXHIBIT_ACTION_PATH: ${{ github.action_path }}
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
        EVIDENCE_BUNDLE: ${{ inputs.evidence-bundle }}
        EXPECTED_SHA: ${{ inputs.head-sha }}
        EXPECTED_PR: ${{ inputs.pull-request }}
        EXPECTED_RUN_ID: ${{ github.run_id }}
        EXPECTED_ATTEMPT: ${{ github.run_attempt }}
        REVIEW_OUTPUT: ${{ inputs.review-output }}
      run: |
        export CODEX_BINARY=/opt/exhibit-codex-cli/node_modules/.bin/codex
        python3 "$EXHIBIT_ACTION_PATH/../../../scripts/codex_evidence_review.py"
    - name: Write Codex CI output report
      id: report
      if: always()
      shell: bash
      env:
        EXHIBIT_ACTION_PATH: ${{ github.action_path }}
        REVIEW_OUTPUT: ${{ inputs.review-output }}
        EXPECTED_SHA: ${{ inputs.head-sha }}
        EXPECTED_PR: ${{ inputs.pull-request }}
        EXPECTED_RUN_ID: ${{ github.run_id }}
        EXPECTED_ATTEMPT: ${{ github.run_attempt }}
      run: python3 "$EXHIBIT_ACTION_PATH/../../../scripts/codex_ci_report.py"
