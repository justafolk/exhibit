name: Implementation task
description: A bounded Exhibit change with acceptance criteria
title: '[Task] '
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user or developer behavior should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: Observable checks, relevant modules, and scope boundaries.
    validations:
      required: true
