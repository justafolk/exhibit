# Private MVP topology. Publish behind a TLS + identity-aware reverse proxy.
# Copy infra/.env.production.example to an untracked file outside the repository.
services:
  app:
    image: exhibit:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:?Set the deployed Git commit}
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    environment:
      DATABASE_URL: postgres://exhibit:${POSTGRES_PASSWORD:?}@postgres:5432/exhibit?sslmode=disable
      EXHIBIT_STORE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: exhibit
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exhibit -d exhibit']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
